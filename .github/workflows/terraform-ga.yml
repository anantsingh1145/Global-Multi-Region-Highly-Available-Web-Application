name: Terraform GA
on:
  push:
    branches:
      - main
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
       working-directory: infrastructure
    steps:
      - name: downloading the repo
        uses: actions/checkout@v2
      # - name: caching the AWS Dependencies
      #   uses: actions/cache@v3
      #   id: aws-cache
      #   with:
      #     path: |
      #       ~/.aws
      #       ~/.aws-sam
      #     key: aws-cache-${{ hashFiles('**/*.tf', '**/*.tfvars') }}
      # - name: downloading AWS CLI
      #   uses: aws-actions/setup-sam@v2
      - name: Setting up the AWS CLI
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: us-west-2
      - name: caching the terraform dependencies
        uses: actions/cache@v3
        id: terraform-cache
        with:
          path: |
            infrastructure/.terraform
          key: terraform-cache-${{ hashFiles('**/*.tf', '**/*.tfvars') }}
      - name: setting up terraform cli
        uses: hashicorp/setup-terraform@v3
      - name: getting into the terraform directory
        run: |
          ls -la
          terraform init
          ls -la
      - name: uploading the terraform folder
        uses: actions/upload-artifact@v6
        with:
          name: terraform-folder
          include-hidden-files: true
          path: |
            infrastructure/.terraform
      - name: initializing terraform
        run: |
          terraform validate
          terraform fmt
  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    defaults:
      run:
       working-directory: infrastructure
    outputs:
      tfplan: ${{ steps.terraform-tfplan.outputs.tfplan }}
    steps:
      - name: downloading the repo
        uses: actions/checkout@v2
      # - name: caching the AWS Dependencies
      #   uses: actions/cache@v3
      #   id: aws-cache
      #   with:
      #     path: |
      #       ~/.aws
      #       ~/.aws-sam
      #     key: aws-cache-${{ hashFiles('**/*.tf', '**/*.tfvars') }}
      # - name: downloading AWS CLI
      #   uses: aws-actions/setup-sam@v2
      - name: Setting up the AWS CLI
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: us-west-2
      - name: caching the terraform dependencies
        uses: actions/cache@v3
        id: terraform-cache
        with:
          path: |
              infrastructure/.terraform
          key: terraform-cache-${{ hashFiles('**/*.tf', '**/*.tfvars') }}
      - name: setting up terraform cli
        uses: hashicorp/setup-terraform@v3
      - name: downloading the terraform folder
        uses: actions/download-artifact@v6
        with:
          name: terraform-folder
          path: infrastructure
      - name: listing the directory
        run: ls -la
      - name: initializing terraform
        id: terraform-tfplan
        run: |
          terraform init
          terraform plan -out=tfplan
          ls -la
          echo "tfplan=$PWD/tfplan" >> "$GITHUB_OUTPUT"
